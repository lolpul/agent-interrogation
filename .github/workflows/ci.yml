name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run unit tests and parse skill YAML
        run: python -m unittest discover -s tests -v

      - name: Validate package and compare skill copies
        run: python scripts/build_plugin.py --check

      - name: Build and verify plugin ZIP
        run: python scripts/build_plugin.py

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-interrogation-zip-${{ runner.os }}
          path: dist/agent-interrogation-*.zip
          if-no-files-found: error
